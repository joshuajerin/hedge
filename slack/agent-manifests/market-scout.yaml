display_information:
  name: Hedge Market Scout
  description: Live market data and price context for Hedge research.
  background_color: "#1F7A5C"
features:
  bot_user:
    display_name: Market Scout
    always_online: true
oauth_config:
  # Outbound thread replies only. No event subscription, Socket Mode, or
  # read/reaction/DM scope is granted to specialist profiles.
  scopes:
    bot:
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
