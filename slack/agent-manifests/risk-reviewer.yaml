display_information:
  name: Hedge Risk Reviewer
  description: Risk review for Hedge research.
  background_color: "#7F1D1D"
features:
  bot_user:
    display_name: Risk Reviewer
    always_online: true
oauth_config:
  # Outbound thread replies only. No event subscription, Socket Mode, or
  # read/reaction/DM scope is granted to specialist profiles.
  scopes:
    bot:
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
